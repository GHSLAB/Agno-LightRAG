services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    networks:
      - agentos

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # --reload-dir limits the watcher to dirs that contain runtime code.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir agents --reload-dir app --reload-dir db --reload-dir evals --reload-dir teams --reload-dir workflows
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      DB_HOST: agentos-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-ai}
    depends_on:
      - agentos-db
    networks:
      - agentos
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.5.7
    container_name: agentos-lightrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - lightrag-storage:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:?Set LIGHTRAG_API_KEY in .env}
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET:?Set LIGHTRAG_TOKEN_SECRET in .env}
      WHITELIST_PATHS: /health
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.minimaxi.com/v1
      LLM_BINDING_API_KEY: ${MINIMAX_API_KEY}
      LLM_MODEL: MiniMax-M3
      OPENAI_LLM_EXTRA_BODY: '{"reasoning_split":true}'
      LLM_TIMEOUT: "180"
      MAX_ASYNC_LLM: "2"
      MAX_PARALLEL_INSERT: "2"
      EMBEDDING_BINDING: ollama
      EMBEDDING_BINDING_HOST: http://host.docker.internal:11434
      EMBEDDING_MODEL: bge-m3:latest
      EMBEDDING_DIM: "1024"
      EMBEDDING_TOKEN_LIMIT: "8192"
      OLLAMA_EMBEDDING_NUM_CTX: "8192"
      EMBEDDING_TIMEOUT: "120"
      EMBEDDING_BATCH_NUM: "8"
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: PGTableGraphStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      POSTGRES_HOST: agentos-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${LIGHTRAG_DB_PASSWORD:?Set LIGHTRAG_DB_PASSWORD in .env}
      POSTGRES_DATABASE: lightrag
      POSTGRES_MAX_CONNECTIONS: "10"
      POSTGRES_VECTOR_INDEX_TYPE: HNSW
      SUMMARY_LANGUAGE: Chinese
      RERANK_BINDING: "null"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentos
    depends_on:
      - agentos-db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

networks:
  agentos:

volumes:
  pgdata:
  lightrag-storage:
  lightrag-inputs:
